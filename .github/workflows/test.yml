name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Check release workflows do not auto-publish
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: pytest --cov=hostlink tests/

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/hostlink

      - name: Validate wheel and sdist contents
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

  windows-contract-smoke:
    name: Windows representative contract smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install smoke-test dependencies
        run: python -m pip install pytest pytest-asyncio

      - name: Run representative Windows transport lifecycle contracts
        run: >-
          python -m pytest -q
          tests/test_transport_recovery.py::test_sync_tcp_traffic_stats_are_independent_of_crlf_segmentation
          tests/test_transport_recovery.py::test_sync_tcp_timeout_is_one_deadline_for_a_trickled_response
          tests/test_transport_recovery.py::test_sync_udp_timeout_discards_delayed_response
          tests/test_transport_recovery.py::test_async_tcp_cancellation_discards_delayed_response
          tests/test_sync_connection_deadline.py::test_sync_connect_timeout_closes_a_late_partial_socket
          tests/test_sync_connection_deadline.py::test_sync_tcp_configuration_failure_closes_candidate_and_preserves_cause
